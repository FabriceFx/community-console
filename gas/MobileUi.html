<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Suivi PE - Community Console Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(26, 115, 232, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.25);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.4);
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .summary-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 16px;
      color: #e2e8f0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: none;
      z-index: 99;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">📱 Community Console Mobile</div>
      <h1>Suivi PE - iPhone</h1>
      <p class="subtitle">Collez l'URL d'un thread Google pour l'enregistrer dans Sheets et générer la réponse Gemini</p>
    </div>

    <!-- Formulaire principal -->
    <div class="card">
      <div class="form-group">
        <label for="threadUrl">Lien du Thread Google Console</label>
        <input type="url" id="threadUrl" placeholder="https://support.google.com/..." autocomplete="off" spellcheck="false">
      </div>

      <div class="form-group">
        <label for="authorName">Prénom / Auteur <span style="font-weight:normal; text-transform:none; opacity:0.75;">(Optionnel)</span></label>
        <input type="text" id="authorName" placeholder="Extrait automatiquement si vide..." autocomplete="off" spellcheck="false">
      </div>

      <div class="form-group">
        <label for="questionContent">Corps de la question / Détails <span style="font-weight:normal; text-transform:none; opacity:0.75;">(Optionnel)</span></label>
        <textarea id="questionContent" rows="3" placeholder="Collez ici le texte complet si la question est longue ou complexe..." autocomplete="off" spellcheck="false" style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; resize: vertical; line-height: 1.4;"></textarea>
      </div>

      <div class="form-group">
        <label for="sharedSecret">Secret partagé</label>
        <input type="password" id="sharedSecret" placeholder="Mémorisé sur cet appareil" autocomplete="off" spellcheck="false">
      </div>

      <button id="submitBtn" class="btn" onclick="submitThread()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">🚀 Analyser & Suivre</span>
      </button>
    </div>

    <!-- Carte de Résultat (Masquée par défaut) -->
    <div id="resultCard" class="card result-card">
      <div class="badge" id="productBadge">Gmail</div>
      <h2 id="resultTitle" style="font-size:16px; font-weight:600; margin-bottom:12px;">-</h2>

      <div id="reviewWarning" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; margin-bottom:14px;"></div>

      <label>Réponse IA Générée par Gemini</label>
      <div class="summary-box" id="summaryText">...</div>

      <button class="btn" onclick="copyAnswer()">
        📋 Copier la réponse
      </button>
      <button class="btn btn-secondary" onclick="resetForm()">
        🔄 Nouveau thread
      </button>
    </div>

    <footer>
      Développé pour les Product Experts Google • <a href="https://faucheux.bzh" target="_blank" style="color:var(--text-muted);">Fabrice Faucheux</a>
    </footer>
  </div>

  <div id="toast" class="toast">✅ Réponse copiée dans le presse-papier !</div>

  <script>
    let currentSummary = "";
    var SECRET_KEY = 'PE_TRACKER_SHARED_SECRET';

    // Le secret est mémorisé sur l'appareil pour ne pas avoir à le ressaisir à chaque thread
    (function restoreSecret() {
      try {
        var stored = localStorage.getItem(SECRET_KEY);
        if (stored) document.getElementById('sharedSecret').value = stored;
      } catch (e) {
        // Stockage local indisponible (navigation privée) : saisie manuelle à chaque fois
      }
    })();

    function submitThread() {
      const urlInput = document.getElementById('threadUrl');
      const url = urlInput.value.trim();
      const authorInput = document.getElementById('authorName');
      const authorName = authorInput ? authorInput.value.trim() : "";
      const contentInput = document.getElementById('questionContent');
      const questionContent = contentInput ? contentInput.value.trim() : "";
      const secretInput = document.getElementById('sharedSecret');
      const sharedSecret = secretInput ? secretInput.value.trim() : "";

      if (!url) {
        alert("Veuillez coller l'URL du thread Google.");
        return;
      }

      if (!sharedSecret) {
        alert("Secret partagé manquant.\n\nGénérez-le dans Google Sheets via « 🛠️ Suivi PE > Ouvrir le panneau de contrôle ».");
        return;
      }

      try {
        localStorage.setItem(SECRET_KEY, sharedSecret);
      } catch (e) {
        // Sans stockage local, le secret devra être ressaisi
      }

      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const resultCard = document.getElementById('resultCard');

      submitBtn.disabled = true;
      spinner.style.display = 'block';
      btnText.innerText = 'Analyse Gemini en cours...';
      resultCard.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.innerText = '🚀 Analyser & Suivre';

          if (response && response.status === 'success') {
            document.getElementById('productBadge').innerText = response.product || 'Google';
            document.getElementById('resultTitle').innerText = (response.author ? response.author + " • " : "") + (response.title || 'Thread enregistré');
            currentSummary = response.summary || '';
            document.getElementById('summaryText').innerText = currentSummary || 'Thread sauvegardé dans Google Sheets.';
            showReviewWarning(response);
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth' });
          } else {
            alert("Erreur : " + (response ? response.message : "Échec du traitement"));
          }
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.innerText = '🚀 Analyser & Suivre';
          alert("Erreur d'analyse : " + error.message);
        })
        .processMobileThreadUrl(url, authorName, questionContent, sharedSecret);
    }

    /**
     * Affiche un avertissement lorsque la proposition ne doit pas être publiée telle quelle.
     * Une procédure générique posée sur une question incomplète est immédiatement repérée
     * comme du remplissage automatique : il vaut mieux demander les éléments manquants.
     */
    function showReviewWarning(response) {
      const box = document.getElementById('reviewWarning');
      const messages = [];

      if (response.replyStatus === 'CLARIFICATION') {
        messages.push("⚠️ Informations insuffisantes : Gemini a rédigé une demande de précisions plutôt qu'une procédure. Ne remplacez pas ce texte par une réponse générique.");
      } else if (response.replyStatus === 'HORS_SUJET') {
        messages.push("⚠️ Demande hors sujet : relisez entièrement avant publication.");
      } else if (response.confidence === 'FAIBLE') {
        messages.push("⚠️ Confiance faible : vérifiez chaque affirmation avant de publier.");
      }

      if (response.contentIsThin) {
        messages.push("ℹ️ Seul le titre du thread a pu être lu. Collez le corps de la question pour une réponse pertinente.");
      }

      box.innerText = messages.join('\n\n');
      box.style.display = messages.length ? 'block' : 'none';
    }

    function copyAnswer() {
      if (!currentSummary) return;
      navigator.clipboard.writeText(currentSummary).then(function() {
        showToast("✅ Réponse copiée dans le presse-papier !");
      }).catch(function() {
        showToast("Sélectionnez et copiez le texte ci-dessus.");
      });
    }

    function resetForm() {
      document.getElementById('threadUrl').value = '';
      if (document.getElementById('authorName')) document.getElementById('authorName').value = '';
      if (document.getElementById('questionContent')) document.getElementById('questionContent').value = '';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('threadUrl').focus();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(function() {
        toast.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
